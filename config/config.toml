[QQ_Adapter]
status = true
ws_host = "127.0.0.1"
ws_port = 8080

[ErisPulse.adapters]

[ErisPulse.framework]
enable_lazy_loading = true
handler_max_concurrency = 64
offline_bot_expiry = 3600
proactive_gc_interval = 300
strict_mode = 0
uninit_timeout = 30

[ErisPulse.i18n]
language = "auto"

[ErisPulse.logger]
format = "rich"
level = "INFO"
log_files = []
memory_limit = 1000

[ErisPulse.modules]

[ErisPulse.server]
host = "0.0.0.0"
port = 8000

[ErisPulse.storage]
use_global_db = false

[ErisPulse.event.command]
case_sensitive = false
prefix = "/"

[ErisPulse.event.message]
ignore_self = true

[ErisPulse.framework.strict_mode_exceptions]
adapters = []
modules = []

[ErisPulse.master.users]
